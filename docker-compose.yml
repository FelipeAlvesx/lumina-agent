version: '3.8'

services:

  # ─── Evolution API v1 (WhatsApp) ──────────────────────────────────
  evolution:
    image: atendai/evolution-api:v1.8.2
    container_name: lumina_evolution
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=false
      - LOG_LEVEL=ERROR
      - DEL_INSTANCE=false
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - lumina_net

  # ─── Patcher @lid (one-shot) ──────────────────────────────────────
  # Aplica o patch @lid no container evolution e o reinicia.
  # O agente só sobe após o patcher completar (depends_on abaixo).
  patcher:
    image: docker:24-cli
    container_name: lumina_patcher
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./setup:/setup:ro
    command: ["/bin/sh", "/setup/patch_evolution.sh"]
    depends_on:
      - evolution
    networks:
      - lumina_net

  # ─── Agente Python ────────────────────────────────────────────────
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: lumina_agent
    restart: always
    ports:
      - "3000:3000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EVOLUTION_URL=http://evolution:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - GOOGLE_CREDENTIALS_PATH=${GOOGLE_CREDENTIALS_PATH:-/app/credentials/google_credentials.json}
      - TENANT_CONFIG=/app/tenants/lumina.yaml
      - LUMINA_ROOT=/app
    volumes:
      - ./tenants:/app/tenants:ro
      - ./prompts:/app/prompts:ro
      - ./verticals:/app/verticals:ro
      - ./knowledge:/app/knowledge:ro
      - ./credentials:/app/credentials:ro
      - agent_db:/app/data
    depends_on:
      patcher:
        condition: service_completed_successfully
    networks:
      - lumina_net

  # ─── Dashboard React (build + Nginx) ──────────────────────────────
  # Em desenvolvimento, use: make dev-dashboard (Vite HMR local)
  # Em demo/produção, use: make up (build React + serve via Nginx)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: lumina_dashboard
    restart: always
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - agent
    networks:
      - lumina_net

  # ─── Backup diário SQLite ─────────────────────────────────────────
  backup:
    image: alpine:3.19
    container_name: lumina_backup
    restart: unless-stopped
    volumes:
      - agent_db:/data:ro
      - agent_db_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache sqlite > /dev/null 2>&1
        echo '0 2 * * * sqlite3 /data/sessions.db ".backup /backups/sessions_$(date +\%Y\%m\%d_\%H\%M\%S).db" && ls -1t /backups/sessions_*.db | tail -n +8 | xargs -r rm --' > /etc/crontabs/root
        crond -f -l 8
    networks:
      - lumina_net

volumes:
  evolution_data:
  agent_db:
  agent_db_backups:

networks:
  lumina_net:
    driver: bridge
